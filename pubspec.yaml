name: otel_graphql_flutter
description: >-
  OpenTelemetry instrumentation for graphql_flutter by Dartastic.io. Adds
  standard OpenTelemetry observability to applications that use
  graphql_flutter.
version: 0.2.2-wip
repository: https://github.com/dartastic/otel_graphql_flutter
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  dartastic_opentelemetry_api: '>=1.0.0-rc.4 <1.0.0-rc.5'
  flutter:
    sdk: flutter
  graphql_flutter: ^5.0.0
  otel_graphql: ^0.3.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  dartastic_opentelemetry: ^1.1.0-beta.17
  flutter_test:
    sdk: flutter
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
